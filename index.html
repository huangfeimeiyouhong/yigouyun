    window.showRoleDetail = function(id) {
      const r = DB.roles.find(x => x.id === id);
      if (!r) return;
      var perms = r.permissions || [];
      var permTags = perms.length > 0
        ? perms.map(function(k) {
            var m = ALL_MENUS.find(x => x.key === k);
            return m ? '<span class="tag tag-blue" style="margin:2px 4px">' + m.icon + ' ' + m.label + '</span>' : '';
          }).join('')
        : '<span style="color:#999">未配置</span>';
      openModal('角色详情', `
        <div class="detail-list">
          <div class="detail-item"><div class="label">角色ID</div><div class="value">${r.id}</div></div>
          <div class="detail-item"><div class="label">角色名称</div><div class="value">${r.name}</div></div>
          <div class="detail-item"><div class="label">角色标识</div><div class="value">${r.code}</div></div>
          <div class="detail-item"><div class="label">关联用户</div><div class="value">${r.userCount || 0} 人</div></div>
          <div class="detail-item"><div class="label">创建时间</div><div class="value">${r.createTime}</div></div>
          <div class="detail-item"><div class="label">状态</div><div class="value">${r.status ? '启用' : '停用'}</div></div>
          <div class="detail-item" style="grid-column:span 2"><div class="label">描述</div><div class="value">${r.description}</div></div>
          <div class="detail-item" style="grid-column:span 2"><div class="label">功能权限（${perms.length} 项）</div><div class="value" style="line-height:2">${permTags}</div></div>
        </div>
      `, '<button class="btn btn-default" onclick="closeModal()">关闭</button>');
    };

    // 构建权限复选框 HTML（按 group 分组）
    window.buildPermCheckboxes = function(checkedKeys) {
      var groups = {};
      ALL_MENUS.forEach(function(m) {
        if (!groups[m.group]) groups[m.group] = [];
        groups[m.group].push(m);
      });
      var html = '';
      Object.keys(groups).sort().forEach(function(g) {
        html += '<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:600;color:#555;margin-bottom:4px;padding-bottom:2px;border-bottom:1px solid #eee">' + g + '</div><div style="display:flex;flex-wrap:wrap;gap:8px">';
        groups[g].forEach(function(m) {
          var checked = checkedKeys.indexOf(m.key) !== -1 ? ' checked' : '';
          html += '<label style="font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;background:#fff;border:1px solid #ddd;' + (checked ? 'border-color:#1a4a7a;background:#eef4fa' : '') + '"><input type="checkbox" value="' + m.key + '" class="role-perm-cb"' + checked + '> ' + m.icon + ' ' + m.label + '</label>';
        });
        html += '</div></div>';
      });
      // 全选/取消全选
      html = '<div style="margin-bottom:10px;display:flex;align-items:center;gap:12px;font-size:13px"><label style="cursor:pointer;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" id="permSelectAll" onchange="togglePermAll(this.checked)" style="cursor:pointer"> <b>全选</b></label><label style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#888"><input type="checkbox" id="permSelectNone" onchange="togglePermAll(false)" style="cursor-pointer"> 取消全选</label></div>' + html;
      return html;
    };

    window.togglePermAll = function(check) {
      document.querySelectorAll('.role-perm-cb').forEach(function(cb) { cb.checked = check;
        cb.parentElement.style.borderColor = check ? '#1a4a7a' : '#ddd';
        cb.parentElement.style.background = check ? '#eef4fa' : '#fff';
      });
      document.getElementById('permSelectAll').checked = check;
      document.getElementById('permSelectNone').checked = !check;
    };

    const __savingRoleId = { val: null };
    window.openRoleModal = function() {
      __savingRoleId.val = null;
      openModal('新增角色', `
        <div class="form-row">
          <div class="form-col"><label class="form-label">角色名称<span class="required">*</span></label><input class="form-input" id="rName" placeholder="如：审计员"></div>
          <div class="form-col"><label class="form-label">角色标识<span class="required">*</span></label><input class="form-input" id="rCode" placeholder="如：auditor" style="text-transform:lowercase"></div>
        </div>
        <div class="form-row">
          <div class="form-col" style="flex:2"><label class="form-label">角色描述</label><input class="form-input" id="rDesc" placeholder="描述该角色的权限范围"></div>
          <div class="form-col"><label class="form-label">状态</label><select class="form-select" id="rStatus"><option value="1">启用</option><option value="0">停用</option></select></div>
        </div>
        <div style="margin-top:16px">
          <label class="form-label" style="font-weight:600;margin-bottom:8px;display:block">&#128274; 权限维护 <span style="font-weight:400;font-size:12px;color:#888">（勾选该角色可访问的功能模块）</span></label>
          <div id="rolePermPanel" style="border:1px solid #e8e8e8;border-radius:6px;padding:12px;max-height:280px;overflow-y:auto;background:#fafafa">
            ${buildPermCheckboxes([])}
          </div>
        </div>
      `, '<button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveRole()">保存</button>');
    };

    window.editRole = function(id) {
      const r = DB.roles.find(x => x.id === id);
      if (!r) return;
      __savingRoleId.val = id;
      openModal('编辑角色', `
        <div class="form-row">
          <div class="form-col"><label class="form-label">角色名称<span class="required">*</span></label><input class="form-input" id="rName" value="${r.name}"></div>
          <div class="form-col"><label class="form-label">角色标识</label><input class="form-input" id="rCode" value="${r.code}" readonly style="background:#f5f5f5"></div>
        </div>
        <div class="form-row">
          <div class="form-col" style="flex:2"><label class="form-label">角色描述</label><input class="form-input" id="rDesc" value="${r.description || ''}"></div>
          <div class="form-col"><label class="form-label">状态</label><select class="form-select" id="rStatus"><option value="1" ${r.status ? 'selected' : ''}>启用</option><option value="0" ${!r.status ? 'selected' : ''}>停用</option></select></div>
        </div>
        <div style="margin-top:16px">
          <label class="form-label" style="font-weight:600;margin-bottom:8px;display:block">&#128274; 权限维护 <span style="font-weight:400;font-size:12px;color:#888">（勾选该角色可访问的功能模块）</span></label>
          <div id="rolePermPanel" style="border:1px solid #e8e8e8;border-radius:6px;padding:12px;max-height:280px;overflow-y:auto;background:#fafafa">
            ${buildPermCheckboxes(r.permissions || [])}
          </div>
        </div>
      `, '<button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveRole()">保存</button>');
    };

    window.saveRole = function() {
      const name = document.getElementById('rName').value.trim();
      const code = document.getElementById('rCode').value.trim().toLowerCase();
      const desc = document.getElementById('rDesc').value.trim();
      const status = parseInt(document.getElementById('rStatus').value);
      // 收集权限
      var perms = [];
      document.querySelectorAll('.role-perm-cb:checked').forEach(function(cb) { perms.push(cb.value); });
      if (!name || !code) { showToast('请填写必填项', 'warning'); return; }
      if (perms.length === 0) { showToast('请至少选择一个权限', 'warning'); return; }
      const editId = __savingRoleId.val;
      if (editId) {
        const r = DB.roles.find(x => x.id === editId);
        if (r) { r.name = name; r.description = desc; r.status = status; r.permissions = perms; }
        DataStore.set('roles', DB.roles);
        closeModal();
        showToast('修改成功', 'success');
      } else {
        if (DB.roles.find(r => r.code === code)) { showToast('角色标识已存在', 'error'); return; }
        const newId = Math.max(...DB.roles.map(r => r.id), 0) + 1;
        DB.roles.push({ id: newId, name, code, description: desc, status, userCount: 0, createTime: '2026-07-26', permissions: perms });
        DataStore.set('roles', DB.roles);
        closeModal();
        showToast('保存成功', 'success');
      }
      // 重建角色菜单配置
      roleConfig = buildRoleConfig();
      renderNav();
      renderRoles(document.getElementById('content'));
    };

    window.deleteRole = async function(id) {
      const r = DB.roles.find(x => x.id === id);
      if (!r) return;
      if (r.userCount > 0) { showToast('该角色下有 ' + r.userCount + ' 个用户，无法删除', 'error'); return; }
      if (!await showConfirm('确认删除角色「' + r.name + '」？', { title: '删除角色', type: 'danger', danger: true })) return;
      const idx = DB.roles.findIndex(x => x.id === id);
      if (idx > -1) { DB.roles.splice(idx, 1); DataStore.set('roles', DB.roles); }
      showToast('已删除', 'success');
      renderRoles(document.getElementById('content'));
    };
    // ===== 用户管理（独立页面） =====
    function renderUserMgmt(el) {
      setBreadcrumb(['首页', '用户管理']);
      window.userMgmtPageState = window.userMgmtPageState || { currentPage: 1, pageSize: 10 };
      var state = window.userMgmtPageState;
      var users = DB.users;
      var totalCount = users.length;
      var paged = users.slice((state.currentPage - 1) * state.pageSize, state.currentPage * state.pageSize);
      el.innerHTML = `
        <div class="card">
          <div class="card-header"><div class="card-title">用户管理</div><button class="btn btn-sm btn-primary" onclick="openUserModal()">+ 新增用户</button></div>
          <div class="card-body" id="userMgmtTableBody">
            ${renderTable(['ID', '账号', '姓名', '角色', '所属食堂', '电话', '最后登录', '状态', '操作'],
              paged.map(u => {
                const canteen = DB.canteens.find(c => c.id === u.canteenId);
                const roleTag = u.role === 'admin' ? '<span class="tag tag-red">平台管理员</span>' : u.role === 'canteenAdmin' ? '<span class="tag tag-blue">食堂管理员</span>' : u.role === 'staff' ? '<span class="tag tag-green">从业人员</span>' : '<span class="tag tag-orange">监管用户</span>';
                const statusTag = u.status ? '<span class="tag tag-green">正常</span>' : '<span class="tag tag-gray">禁用</span>';
                return [u.id, u.username, u.realName, roleTag, canteen ? canteen.name : '-', u.phone, u.lastLogin, statusTag, '<button class="btn btn-sm btn-default" onclick="editUser(' + u.id + ')">编辑</button>'];
              }))
            }
            ${renderPaginationBar(state, 'goToUserMgmtPage', totalCount)}
          </div>
        </div>`;
    }

    window.goToUserMgmtPage = function(page) {
      window.userMgmtPageState.currentPage = page;
      renderUserMgmt(document.getElementById('content'));
    };

    // ===== 参数设置（独立页面） =====
    function renderSysParamsPage(el) {
      setBreadcrumb(['首页', '参数设置']);
      el.innerHTML = `
        <div class="card">
          <div class="card-header"><div class="card-title">系统参数</div><button class="btn btn-sm btn-primary" id="sysParamEditBtn" onclick="toggleSysParamEdit()">编辑</button></div>
          <div class="card-body" id="sysParamsBody"></div>
        </div>`;
      __sysParamEditing = false;
      renderSysParams();
    }

    // ===== 系统参数编辑 =====
    var __sysParamEditing = false;

    function renderSysParams() {
      var p = DB.sysParams || {};
      var body = document.getElementById('sysParamsBody');
      if (!body) return;
      if (__sysParamEditing) {
        body.innerHTML = `
          <div class="detail-list">
            <div class="detail-item"><div class="label">系统名称</div><div class="value"><input type="text" id="sp_systemName" value="${p.systemName || ''}" style="width:200px"></div></div>
            <div class="detail-item"><div class="label">系统版本</div><div class="value"><input type="text" id="sp_systemVersion" value="${p.systemVersion || ''}" style="width:120px"></div></div>
            <div class="detail-item"><div class="label">留样保存期限</div><div class="value"><input type="number" id="sp_sampleKeepHours" value="${p.sampleKeepHours || 48}" min="1" style="width:80px"> 小时</div></div>
            <div class="detail-item"><div class="label">健康证提前提醒天数</div><div class="value"><input type="number" id="sp_healthCertWarnDays" value="${p.healthCertWarnDays || 30}" min="1" style="width:80px"> 天</div></div>
            <div class="detail-item"><div class="label">异常预警自动处理时限</div><div class="value"><input type="number" id="sp_alertAutoHandleHours" value="${p.alertAutoHandleHours || 24}" min="1" style="width:80px"> 小时</div></div>
            <div class="detail-item"><div class="label">数据备份周期</div><div class="value"><input type="text" id="sp_backupSchedule" value="${p.backupSchedule || ''}" style="width:160px"></div></div>
          </div>
          <div style="margin-top:16px;display:flex;gap:8px">
            <button class="btn btn-primary" onclick="saveSysParams()">保存</button>
            <button class="btn btn-default" onclick="toggleSysParamEdit()">取消</button>
          </div>
        `;
        document.getElementById('sysParamEditBtn').style.display = 'none';
      } else {
        body.innerHTML = `
          <div class="detail-list">
            <div class="detail-item"><div class="label">系统名称</div><div class="value">${p.systemName || '-'}</div></div>
            <div class="detail-item"><div class="label">系统版本</div><div class="value">${p.systemVersion || '-'}</div></div>
            <div class="detail-item"><div class="label">留样保存期限</div><div class="value">${p.sampleKeepHours || '-'}小时</div></div>
            <div class="detail-item"><div class="label">健康证提前提醒天数</div><div class="value">${p.healthCertWarnDays || '-'}天</div></div>
            <div class="detail-item"><div class="label">异常预警自动处理时限</div><div class="value">${p.alertAutoHandleHours || '-'}小时</div></div>
            <div class="detail-item"><div class="label">数据备份周期</div><div class="value">${p.backupSchedule || '-'}</div></div>
          </div>
        `;
        document.getElementById('sysParamEditBtn').style.display = '';
      }
    }

    window.toggleSysParamEdit = function() {
      __sysParamEditing = !__sysParamEditing;
      renderSysParams();
    };

    window.saveSysParams = function() {
      var name = document.getElementById('sp_systemName').value.trim();
      var version = document.getElementById('sp_systemVersion').value.trim();
      var keepHrs = parseInt(document.getElementById('sp_sampleKeepHours').value);
      var warnDays = parseInt(document.getElementById('sp_healthCertWarnDays').value);
      var alertHrs = parseInt(document.getElementById('sp_alertAutoHandleHours').value);
      var backup = document.getElementById('sp_backupSchedule').value.trim();

      if (!name) { showToast('请填写系统名称', 'warning'); return; }
      if (!version) { showToast('请填写系统版本', 'warning'); return; }
      if (!keepHrs || keepHrs < 1) { showToast('留样保存期限必须大于0', 'warning'); return; }
      if (!warnDays || warnDays < 1) { showToast('提醒天数必须大于0', 'warning'); return; }
      if (!alertHrs || alertHrs < 1) { showToast('处理时限必须大于0', 'warning'); return; }
      if (!backup) { showToast('请填写数据备份周期', 'warning'); return; }

      DB.sysParams = {
        systemName: name,
        systemVersion: version,
        sampleKeepHours: keepHrs,
        healthCertWarnDays: warnDays,
        alertAutoHandleHours: alertHrs,
        backupSchedule: backup
      };
      DataStore.set('sysParams', DB.sysParams);
      __sysParamEditing = false;
      renderSysParams();
      showToast('系统参数已保存', 'success');
    };

    // ===== 用户管理编辑 =====
    var __editingUserId = null;

    function userRoleOptions(selected) {
      var all = [['admin', '平台管理员'], ['canteenAdmin', '食堂管理员'], ['staff', '从业人员'], ['inspector', '监管用户']];
      var allowed = currentUser.role === 'canteenAdmin' ? [['canteenAdmin', '食堂管理员'], ['staff', '从业人员']] : all;
      return allowed.map(function(o) { return '<option value="' + o[0] + '"' + (selected === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
    }

    window.openUserModal = function() {
      __editingUserId = null;
      openModal('新增用户', `
        <div class="form-row">
          <div class="form-col"><label class="form-label">账号<span class="required">*</span></label><input class="form-input" id="uUsername" placeholder="登录账号"></div>
          <div class="form-col"><label class="form-label">姓名<span class="required">*</span></label><input class="form-input" id="uRealName" placeholder="真实姓名"></div>
        </div>
        <div class="form-row">
          <div class="form-col"><label class="form-label">角色<span class="required">*</span></label><select class="form-select" id="uRole"><option value="">请选择角色</option>${userRoleOptions('')}</select></div>
          <div class="form-col"><label class="form-label">所属食堂</label><select class="form-select" id="uCanteenId"><option value="">无（平台管理员/监管用户）</option>${DB.canteens.filter(c => c.status).map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('')}</select></div>
        </div>
        <div class="form-row">
          <div class="form-col"><label class="form-label">联系电话</label><input class="form-input" id="uPhone" placeholder="手机号码"></div>
          <div class="form-col"><label class="form-label">初始密码</label><input class="form-input" id="uPassword" value="123456"></div>
        </div>
        <div class="form-row">
          <div class="form-col"><label class="form-label">状态</label><select class="form-select" id="uStatus"><option value="1">正常</option><option value="0">禁用</option></select></div>
        </div>`,
        '<button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveUser()">保存</button>'
      );
    };

    window.editUser = function(id) {
      var u = DB.users.find(x => x.id === id);
      if (!u) return;
      __editingUserId = id;
      openModal('编辑用户 - ' + u.realName, `
        <div class="form-row">
          <div class="form-col"><label class="form-label">账号<span class="required">*</span></label><input class="form-input" id="uUsername" value="${u.username}"></div>
          <div class="form-col"><label class="form-label">姓名<span class="required">*</span></label><input class="form-input" id="uRealName" value="${u.realName}"></div>
        </div>
        <div class="form-row">
          <div class="form-col"><label class="form-label">角色<span class="required">*</span></label><select class="form-select" id="uRole">${userRoleOptions(u.role)}</select></div>
          <div class="form-col"><label class="form-label">所属食堂</label><select class="form-select" id="uCanteenId"><option value=""${!u.canteenId ? ' selected' : ''}>无（平台管理员/监管用户）</option>${DB.canteens.filter(c => c.status).map(c => '<option value="' + c.id + '"' + (u.canteenId === c.id ? ' selected' : '') + '>' + c.name + '</option>').join('')}</select></div>
        </div>
        <div class="form-row">
          <div class="form-col"><label class="form-label">联系电话</label><input class="form-input" id="uPhone" value="${u.phone || ''}"></div>
          <div class="form-col"><label class="form-label">状态</label><select class="form-select" id="uStatus"><option value="1"${u.status ? ' selected' : ''}>正常</option><option value="0"${!u.status ? ' selected' : ''}>禁用</option></select></div>
        </div>`,
        '<button class="btn btn-default" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveUser()">保存</button>'
      );
    };

    window.saveUser = function() {
      var username = document.getElementById('uUsername').value.trim();
      var realName = document.getElementById('uRealName').value.trim();
      var role = document.getElementById('uRole').value;
      var canteenId = parseInt(document.getElementById('uCanteenId').value) || null;
      var phone = document.getElementById('uPhone').value.trim();
      var status = document.getElementById('uStatus').value === '1';

      if (!username) { showToast('请填写账号', 'warning'); return; }
      if (!realName) { showToast('请填写姓名', 'warning'); return; }
      if (!role) { showToast('请选择角色', 'warning'); return; }

      // 账号唯一性检查
      var existing = DB.users.find(u => u.username === username && u.id !== __editingUserId);
      if (existing) { showToast('该账号已存在', 'error'); return; }

      if (__editingUserId) {
        // 编辑
        var u = DB.users.find(x => x.id === __editingUserId);
        if (u) {
          u.username = username; u.realName = realName; u.role = role;
          u.canteenId = canteenId; u.phone = phone; u.status = status;
          DataStore.set('users', DB.users);
        }
        showToast('用户信息已更新', 'success');
      } else {
        // 新增
        var newId = Math.max(...DB.users.map(x => x.id), 0) + 1;
        DB.users.push({
          id: newId, username, realName, role, password: document.getElementById('uPassword') ? document.getElementById('uPassword').value : '123456',
          canteenId, phone, status,
          lastLogin: '-', createTime: new Date().toISOString().slice(0, 16).replace('T', ' ')
        });
        DataStore.set('users', DB.users);
        showToast('用户已创建，默认密码：123456', 'success');
      }
      closeModal();
      renderUserMgmt(document.getElementById('content'));
    };

    // ===================== 启动 =====================
    renderNav();
    renderContent();
  </script>
</body>
</html>
