<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧食安管理系统 - 登录</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a3a5c'/%3E%3Cpath d='M16 5L7 9v7c0 5.5 4 10.2 9 11.5 5-1.3 9-6 9-11.5V9l-9-4z' fill='none' stroke='%2352c41a' stroke-width='1.8'/%3E%3Cpath d='M12 15.5l2.5 2.5 5.5-5.5' fill='none' stroke='%2352c41a' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='6' fill='%23fff' font-weight='bold'%3E食安%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      overflow: hidden;
    }
    .login-wrapper {
      display: flex;
      height: 100vh;
    }
    .login-left {
      width: 55%;
      background: linear-gradient(135deg, #1a4a7a 0%, #0d2d4f 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .login-left::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-left .logo-area {
      text-align: center;
      z-index: 1;
    }
    .login-left .logo-icon {
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 36px;
    }
    .login-left h1 {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }
    .login-left p {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 2px;
    }
    .login-left .features {
      margin-top: 60px;
      display: flex;
      gap: 40px;
      z-index: 1;
    }
    .login-left .feature-item {
      text-align: center;
      color: rgba(255,255,255,0.85);
    }
    .login-left .feature-item .num {
      font-size: 28px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    .login-left .feature-item .label {
      font-size: 12px;
    }
    .login-right {
      width: 45%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #fff;
      padding: 40px;
    }
    .login-box {
      width: 100%;
      max-width: 380px;
    }
    .login-box h2 {
      font-size: 24px;
      color: #1a1a1a;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .login-box .subtitle {
      font-size: 13px;
      color: #999;
      margin-bottom: 32px;
    }
    .role-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .role-tag {
      padding: 6px 14px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
    }
    .role-tag:hover, .role-tag.active {
      border-color: #1a4a7a;
      color: #1a4a7a;
      background: #f0f5ff;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #333;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #1a4a7a;
    }
    .form-group .hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #1a4a7a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .login-btn:hover {
      background: #133a61;
    }
    .login-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .error-msg {
      color: #ff4d4f;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 12px;
      color: #999;
    }
    @media (max-width: 900px) {
      .login-left { display: none; }
      .login-right { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-left">
      <div class="logo-area">
        <div class="logo-icon">&#127858;</div>
        <h1>智慧食安管理系统</h1>
        <p>Smart Food Safety Management Platform</p>
      </div>
      <div class="features">
        <div class="feature-item">
          <span class="num">3</span>
          <span class="label">接入食堂</span>
        </div>
        <div class="feature-item">
          <span class="num">28</span>
          <span class="label">从业人员</span>
        </div>
        <div class="feature-item">
          <span class="num">8</span>
          <span class="label">物联设备</span>
        </div>
        <div class="feature-item">
          <span class="num">99%</span>
          <span class="label">合规率</span>
        </div>
      </div>
    </div>
    <div class="login-right">
      <div class="login-box">
        <h2>用户登录</h2>
        <p class="subtitle">请选择角色并输入账号密码</p>
        <div class="role-selector" id="roleSelector">
          <span class="role-tag active" data-role="admin">平台管理员</span>
          <span class="role-tag" data-role="canteenAdmin">食堂管理员</span>
          <span class="role-tag" data-role="staff">从业人员</span>
          <span class="role-tag" data-role="inspector">监管用户</span>
        </div>
        <div class="form-group">
          <label>账号</label>
          <input type="text" id="username" placeholder="请输入账号">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码" value="admin123">
        </div>
        <button class="login-btn" id="loginBtn">登 录</button>
        <p class="error-msg" id="errorMsg">账号或密码错误</p>
      </div>
      <div class="footer">智慧食安管理系统 v1.0.0 | 技术支持：厦门易购云科技有限公司</div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script>
    DataStore.init();

    const roleHints = {
      admin: { defaultUser: 'admin' },
      canteenAdmin: { defaultUser: 'ct001' },
      staff: { defaultUser: 'staff001' },
      inspector: { defaultUser: 'insp001' }
    };

    let selectedRole = 'admin';
    document.getElementById('username').value = roleHints[selectedRole].defaultUser;
    document.getElementById('password').value = selectedRole === 'admin' ? 'admin123' : '123456';

    document.querySelectorAll('.role-tag').forEach(tag => {
      tag.addEventListener('click', () => {
        document.querySelectorAll('.role-tag').forEach(t => t.classList.remove('active'));
        tag.classList.add('active');
        selectedRole = tag.dataset.role;
        document.getElementById('username').value = roleHints[selectedRole].defaultUser;
        document.getElementById('password').value = selectedRole === 'admin' ? 'admin123' : '123456';
      });
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      const users = DataStore.get('users') || [];
      const user = users.find(u => u.username === username && u.password === password);

      if (!user) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = '账号或密码错误';
        return;
      }
      if (user.role !== selectedRole) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = '所选角色与账号不匹配，请重新选择';
        return;
      }
      if (!user.status) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = '账号已被禁用，请联系管理员';
        return;
      }

      errorMsg.style.display = 'none';
      DataStore.set('currentUser', user);
      var _redirect = new URLSearchParams(window.location.search).get('redirect');
      var _target = _redirect ? decodeURIComponent(_redirect) : '';
      window.location.href = (_target ? ('/' + _target) : '/');
    });

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
